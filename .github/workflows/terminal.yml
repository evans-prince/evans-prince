# Re-draws assets/terminal.svg with live numbers every 6 hours.
name: Refresh terminal
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node gen.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then echo "No change"; exit 0; fi
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add assets/terminal.svg assets/stats.svg
          git commit -m "Refresh live terminal"
          git push
